name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cartagena-tours/package-lock.json
      - name: Compilar Mundo Arte Tours
        working-directory: cartagena-tours
        env:
          BASE_PATH: /mundoartestours/
          SITE_URL: https://www.mikeleguizamo.com
        run: |
          npm ci
          npm run build
      - name: Armar el sitio
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'cartagena-tours' ./ _site/
          mkdir _site/mundoartestours
          cp -r cartagena-tours/dist/. _site/mundoartestours/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
